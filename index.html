<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>将棋耐久配信ルーレット - 光と闇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        @keyframes tickBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px) scale(1.05); }
        }
        .pointer-tick {
            animation: tickBounce 0.08s ease-in-out;
        }
    </style>
</head>
<body id="app-body" class="bg-amber-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300">

    <!-- Top Navigation & OBS Controls -->
    <header class="w-full max-w-xl flex flex-col sm:flex-row items-center justify-between gap-3 mb-2">
        <h1 id="app-title" class="text-xl font-bold tracking-wide flex items-center gap-2 text-slate-800 transition-colors">
            <span>☗</span>
            <span>将棋耐久ルーレット</span>
            <span>☖</span>
        </h1>
        <div class="flex items-center gap-2">
            <button id="btn-greenscreen" class="px-3 py-1.5 rounded-lg bg-white hover:bg-amber-100 border border-amber-300 text-slate-700 text-xs font-semibold transition flex items-center gap-1 shadow">
                <span>🟩</span>
                <span id="gs-label">OBSグリーンバック</span>
            </button>
            <button id="btn-sound" class="px-3 py-1.5 rounded-lg bg-white hover:bg-amber-100 border border-amber-300 text-slate-700 text-xs font-semibold transition flex items-center gap-1 shadow">
                <span id="sound-icon">🔊</span>
                <span id="sound-label">効果音 ON</span>
            </button>
        </div>
    </header>

    <main class="w-full max-w-lg flex flex-col items-center my-auto">
        <!-- Mode Switcher -->
        <div class="grid grid-cols-2 gap-3 w-full mb-6">
            <!-- Light Mode (1/10) -->
            <button id="tab-light" class="p-3.5 rounded-xl border-2 transition-all duration-200 flex flex-col items-center border-amber-500 bg-amber-200/60 shadow-lg shadow-amber-300/40 scale-[1.02]">
                <div class="font-extrabold text-base sm:text-lg text-amber-900">
                    <span>光のルーレット</span>
                </div>
                <div class="text-xs text-amber-800/90 font-medium mt-0.5">確率 1 / 10 で配信終了</div>
            </button>

            <!-- Dark Mode (1/100) -->
            <button id="tab-dark" class="p-3.5 rounded-xl border-2 transition-all duration-200 flex flex-col items-center border-amber-200 bg-white/70 opacity-60 hover:opacity-90">
                <div class="font-extrabold text-base sm:text-lg text-purple-700">
                    <span>闇のルーレット</span>
                </div>
                <div class="text-xs text-purple-600/90 font-medium mt-0.5">確率 1 / 100 で配信終了</div>
            </button>
        </div>

        <!-- Wheel Area -->
        <div class="relative flex items-center justify-center p-2">
            <!-- Top Pointer Needle -->
            <div id="pointer" class="absolute -top-3 z-20 flex flex-col items-center pointer-events-none transition-transform">
                <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[28px] border-t-red-500 drop-shadow-md"></div>
                <div class="w-3 h-3 bg-white rounded-full -mt-6 shadow"></div>
            </div>

            <!-- Canvas Wheel -->
            <div id="wheel-frame" class="rounded-full p-2 bg-amber-100 border-4 border-amber-400 shadow-2xl transition-colors duration-300">
                <canvas id="rouletteCanvas" class="rounded-full block w-[320px] h-[320px] sm:w-[380px] sm:h-[380px]"></canvas>
            </div>
        </div>

        <!-- Spin Button Area -->
        <div class="mt-6 flex flex-col items-center">
            <button id="btn-spin" class="px-14 py-3.5 rounded-full text-2xl font-black text-white bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 active:scale-95 shadow-lg shadow-orange-500/30 transition-all duration-150 tracking-wider">
                SPIN!
            </button>
        </div>
    </main>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-200">
        <div id="modal-card" class="relative bg-slate-900 border-2 border-slate-700 rounded-3xl p-8 sm:p-10 text-center shadow-2xl max-w-md w-full flex flex-col items-center">
            
            <!-- Close 'X' Button in Top Right -->
            <button id="btn-modal-x" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-full w-9 h-9 flex items-center justify-center text-lg font-bold transition" aria-label="閉じる">
                ✕
            </button>

            <!-- Result Main Text (Only '配信継続！' for continuation, or win celebration) -->
            <div id="result-text" class="text-5xl sm:text-6xl font-black py-6 tracking-wide leading-tight">
                配信継続！
            </div>
        </div>
    </div>

    <div style="margin: 20px">
      <iframe width="560" height="315" src="https://www.youtube.com/embed/?list=UUvgMIl03m56TuoBPCFIYHlQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    
    <footer>
      <small><a href="https://www.youtube.com/@tampopo_ch">&copy; 2026 たんぽぽちゃん</a></small>
    </footer>

    <script>
        /**
         * Web Audio API Synthesizer (Zero external assets required)
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTick(speedFactor = 1) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200 * speedFactor, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.02);

                gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.02);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.025);
            }

            playContinue() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.35);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.45);
            }

            playWin() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + (idx * 0.07));

                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime + (idx * 0.07));
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime + (idx * 0.07));
                    osc.stop(this.ctx.currentTime + 1.3);
                });
            }
        }

        const sound = new SoundEngine();

        const MODES = {
            light: {
                total: 10,     // 1/10
                winIndex: 0,
                palette: {
                    win: '#ef4444',
                    sliceA: '#fffbeb',  // 明るいアイボリーホワイト
                    sliceB: '#fef08a',  // 明るいサンイエロー
                    stroke: '#fbbf24',  // 黄金ゴールド
                    text: '#78350f'     // 明るい盤面で見やすい濃いアンバー文字
                }
            },
            dark: {
                total: 100,    // 1/100
                winIndex: 0,
                palette: {
                    win: '#dc2626',     // 深紅
                    sliceA: '#090417',  // 漆黒の闇紫
                    sliceB: '#170b30',  // 深淵のダークバイオレット
                    stroke: '#3b1d75',  // 妖しい紫の境界線
                    text: '#c084fc'     // 闇に光るパープル文字
                }
            }
        };

        let currentMode = 'light';
        let currentRotation = 0;
        let isSpinning = false;
        let isGreenScreen = false;

        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('rouletteCanvas');
            const ctx = canvas.getContext('2d');

            const size = 380;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            ctx.scale(dpr, dpr);

            // DOM Elements
            const tabLight = document.getElementById('tab-light');
            const tabDark = document.getElementById('tab-dark');
            const btnSpin = document.getElementById('btn-spin');
            const pointer = document.getElementById('pointer');
            const btnGreenScreen = document.getElementById('btn-greenscreen');
            const btnSound = document.getElementById('btn-sound');
            const soundIcon = document.getElementById('sound-icon');
            const soundLabel = document.getElementById('sound-label');

            const modal = document.getElementById('result-modal');
            const modalCard = document.getElementById('modal-card');
            const resultText = document.getElementById('result-text');
            const btnModalX = document.getElementById('btn-modal-x');

            function drawWheel(angle = 0) {
                const config = MODES[currentMode];
                const total = config.total;
                const arc = (Math.PI * 2) / total;
                const cx = size / 2;
                const cy = size / 2;
                const radius = (size / 2) - 8;

                ctx.clearRect(0, 0, size, size);
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                for (let i = 0; i < total; i++) {
                    const sliceStart = i * arc;
                    const sliceEnd = sliceStart + arc;
                    const isWin = (i === config.winIndex);

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, radius, sliceStart, sliceEnd);
                    ctx.closePath();

                    ctx.fillStyle = isWin ? config.palette.win : ((i % 2 === 0) ? config.palette.sliceA : config.palette.sliceB);
                    ctx.fill();

                    ctx.strokeStyle = isWin ? '#fbbf24' : config.palette.stroke;
                    ctx.lineWidth = total > 50 ? 0.6 : 1.5;
                    ctx.stroke();

                    // Text labels
                ctx.save();
                ctx.rotate(sliceStart + arc / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';

                if (isWin) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 15px sans-serif';
                    ctx.fillText('終了', radius - 14, 0);
                } else if (total <= 20) {
                    ctx.fillStyle = config.palette.text;
                    ctx.font = 'bold 13px sans-serif';
                    ctx.fillText('継続', radius - 14, 0);
                }
                ctx.restore();
            }

            // Center hub circle
            ctx.beginPath();
            ctx.arc(0, 0, 32, 0, Math.PI * 2);
            ctx.fillStyle = currentMode === 'light' ? '#ffffff' : '#090417';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = currentMode === 'light' ? '#f59e0b' : '#a855f7';
            ctx.stroke();

            ctx.restore();
        }

        const wheelFrame = document.getElementById('wheel-frame');
        const appBody = document.getElementById('app-body');
        const appTitle = document.getElementById('app-title');

        function applyBackgroundTheme() {
            if (isGreenScreen) return;
            if (currentMode === 'light') {
                appBody.className = "bg-amber-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300";
                if (appTitle) appTitle.className = "text-xl font-bold tracking-wide flex items-center gap-2 text-slate-800 transition-colors";
                btnGreenScreen.className = "px-3 py-1.5 rounded-lg bg-white hover:bg-amber-100 border border-amber-300 text-slate-700 text-xs font-semibold transition flex items-center gap-1 shadow";
                btnSound.className = "px-3 py-1.5 rounded-lg bg-white hover:bg-amber-100 border border-amber-300 text-slate-700 text-xs font-semibold transition flex items-center gap-1 shadow";
            } else {
                appBody.className = "bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300";
                if (appTitle) appTitle.className = "text-xl font-bold tracking-wide flex items-center gap-2 text-white transition-colors";
                btnGreenScreen.className = "px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold transition flex items-center gap-1 shadow";
                btnSound.className = "px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold transition flex items-center gap-1 shadow";
            }
        }

        function setMode(mode) {
            if (isSpinning) return;
            currentMode = mode;

            if (mode === 'light') {
                tabLight.className = "p-3.5 rounded-xl border-2 transition-all duration-200 flex flex-col items-center border-amber-500 bg-amber-200/60 shadow-lg shadow-amber-300/40 scale-[1.02]";
                tabDark.className = "p-3.5 rounded-xl border-2 transition-all duration-200 flex flex-col items-center border-amber-200 bg-white/70 opacity-60 hover:opacity-90";
                tabLight.querySelector('div').className = "font-extrabold text-base sm:text-lg text-amber-900";
                tabLight.querySelectorAll('div')[1].className = "text-xs text-amber-800/90 font-medium mt-0.5";
                tabDark.querySelector('div').className = "font-extrabold text-base sm:text-lg text-purple-700";
                tabDark.querySelectorAll('div')[1].className = "text-xs text-purple-600/90 font-medium mt-0.5";

                btnSpin.className = "px-14 py-3.5 rounded-full text-2xl font-black text-white bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 active:scale-95 shadow-lg shadow-orange-500/30 transition-all duration-150 tracking-wider";
                if (wheelFrame) {
                    wheelFrame.className = "rounded-full p-2 bg-amber-100 border-4 border-amber-400 shadow-2xl transition-colors duration-300";
                }
            } else {
                tabDark.className = "p-3.5 rounded-xl border-2 transition-all duration-200 flex flex-col items-center border-purple-500 bg-purple-500/20 shadow-lg shadow-purple-500/20 scale-[1.02]";
                tabLight.className = "p-3.5 rounded-xl border-2 transition-all duration-200 flex flex-col items-center border-slate-700 bg-slate-800/60 opacity-60 hover:opacity-90";
                tabLight.querySelector('div').className = "font-extrabold text-base sm:text-lg text-amber-300";
                tabLight.querySelectorAll('div')[1].className = "text-xs text-amber-200/90 font-medium mt-0.5";
                tabDark.querySelector('div').className = "font-extrabold text-base sm:text-lg text-purple-300";
                tabDark.querySelectorAll('div')[1].className = "text-xs text-purple-200/90 font-medium mt-0.5";

                btnSpin.className = "px-14 py-3.5 rounded-full text-2xl font-black text-white bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 active:scale-95 shadow-lg shadow-purple-600/30 transition-all duration-150 tracking-wider";
                if (wheelFrame) {
                    wheelFrame.className = "rounded-full p-2 bg-slate-950 border-4 border-purple-900 shadow-2xl shadow-purple-950/50 transition-colors duration-300";
                }
            }

            applyBackgroundTheme();
            drawWheel(currentRotation);
        }

        function startSpin() {
                if (isSpinning) return;
                isSpinning = true;
                btnSpin.disabled = true;
                btnSpin.classList.add('opacity-50', 'cursor-not-allowed');

                sound.init();

                const config = MODES[currentMode];
                const total = config.total;
                const arc = (Math.PI * 2) / total;

                // Random target slice based on actual probability
                const selectedIndex = Math.floor(Math.random() * total);

                // 必ず毎回しっかり5周〜7周回転させる
                const extraSpins = 5 + Math.floor(Math.random() * 3);
                const sliceCenterAngle = selectedIndex * arc + (arc / 2);
                const jitter = (Math.random() - 0.5) * (arc * 0.7);
                const targetSliceAngle = sliceCenterAngle + jitter;

                // 現在の回転角度を 0 〜 2π の範囲に正規化
                const twoPi = Math.PI * 2;
                const startAngle = currentRotation;
                const currentNorm = ((startAngle % twoPi) + twoPi) % twoPi;

                // 針の位置（頂点 = 1.5π / 270度）
                // 盤面を時計回りに回転させたとき、針が当たる盤面上の現在角度
                const currentPointerAngle = ((Math.PI * 1.5 - currentNorm) % twoPi + twoPi) % twoPi;

                // 目的のマスが針の位置に来るまでに必要な回転量 (時計回り)
                let diff = (currentPointerAngle - targetSliceAngle + twoPi) % twoPi;

                // 最低 extraSpins 周 + 目的マスまでの角度差分
                const deltaAngle = (extraSpins * twoPi) + diff;
                const duration = 5000; // 5秒間
                const startTime = performance.now();

                let lastTickSector = -1;

                function easeOutQuint(t) {
                    return 1 - Math.pow(1 - t, 5);
                }

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = easeOutQuint(progress);

                    currentRotation = startAngle + deltaAngle * eased;
                    drawWheel(currentRotation);

                    const normalized = ((Math.PI * 1.5 - currentRotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                    const currentSector = Math.floor(normalized / arc);

                    if (currentSector !== lastTickSector) {
                        lastTickSector = currentSector;
                        pointer.classList.remove('pointer-tick');
                        void pointer.offsetWidth;
                        pointer.classList.add('pointer-tick');

                        const speedRatio = 1 - progress;
                        sound.playTick(0.8 + speedRatio * 0.5);
                    }

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        // 回転終了時に角度を 0〜2π に丸めて次回以降の計算の狂いを防止
                        currentRotation = currentRotation % twoPi;
                        drawWheel(currentRotation);

                        isSpinning = false;
                        btnSpin.disabled = false;
                        btnSpin.classList.remove('opacity-50', 'cursor-not-allowed');
                        showResult(selectedIndex);
                    }
                }

                requestAnimationFrame(animate);
            }

            function showResult(index) {
                const config = MODES[currentMode];
                const isWin = (index === config.winIndex);

                if (isWin) {
                    sound.playWin();
                    resultText.innerText = "配信終了！";
                    resultText.className = "text-5xl sm:text-6xl font-black py-6 tracking-wide leading-tight text-red-500 drop-shadow-md";
                    modalCard.className = "relative bg-slate-900 border-4 border-red-500 rounded-3xl p-8 sm:p-10 text-center shadow-2xl max-w-md w-full flex flex-col items-center";
                } else {
                    sound.playContinue();
                    // Requirement: Only display "配信継続！" (no subtitles)
                    resultText.innerText = "配信継続！";
                    resultText.className = "text-5xl sm:text-6xl font-black py-6 tracking-wide leading-tight text-white";
                    modalCard.className = "relative bg-slate-900 border-2 border-slate-700 rounded-3xl p-8 sm:p-10 text-center shadow-2xl max-w-md w-full flex flex-col items-center";
                }

                modal.classList.remove('hidden');
            }

            function closeModal() {
                modal.classList.add('hidden');
            }

            tabLight.addEventListener('click', () => setMode('light'));
            tabDark.addEventListener('click', () => setMode('dark'));
            btnSpin.addEventListener('click', startSpin);
            btnModalX.addEventListener('click', closeModal);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'Enter') {
                    e.preventDefault();
                    if (!modal.classList.contains('hidden')) {
                        closeModal();
                    } else {
                        startSpin();
                    }
                } else if (e.code === 'Escape') {
                    if (!modal.classList.contains('hidden')) {
                        closeModal();
                    }
                }
            });

            // Green screen toggle
            btnGreenScreen.addEventListener('click', () => {
                isGreenScreen = !isGreenScreen;
                const body = document.getElementById('app-body');
                if (isGreenScreen) {
                    body.style.backgroundColor = '#00FF00';
                    document.getElementById('gs-label').innerText = '通常背景に戻す';
                } else {
                    body.style.backgroundColor = '';
                    document.getElementById('gs-label').innerText = 'OBSグリーンバック';
                    applyBackgroundTheme();
                }
            });

            // Sound toggle
            btnSound.addEventListener('click', () => {
                sound.enabled = !sound.enabled;
                if (sound.enabled) {
                    soundIcon.innerText = '🔊';
                    soundLabel.innerText = '効果音 ON';
                } else {
                    soundIcon.innerText = '🔇';
                    soundLabel.innerText = '効果音 OFF';
                }
            });

            // Initial render
            drawWheel(0);
        });
    </script>
</body>
</html>
